<!doctype html>
<meta charset="utf-8">
<title>Northants Bitcoin Network</title>
<script>
  /* Old npub.pro links used /post/<id> paths. Send anything unknown to the
     single-page app, preserving a post id when we can spot one. */
  (function () {
    var m = location.pathname.match(/\/post\/((?:note|nevent)1[a-z0-9]+)/i);
    var base = location.pathname.replace(/\/(post|tag|author|notes|page)\/.*$/, "/");
    location.replace(base + (m ? "#/note/" + m[1] : "#/"));
  })();
</script>
<p>Redirecting… <a href="./">Go to the homepage</a>.</p>
